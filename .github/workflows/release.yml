name: release

on:
  push:
    branches:
    - '!*'
    tags:
    - v*.*.*

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        submodules: true
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: 'go.mod'
    - name: Install Cosign
      uses: sigstore/cosign-installer@v4.1.2
      with:
        cosign-release: 'v2.6.1'
    - name: Create GitHub App token
      uses: actions/create-github-app-token@v3.3.0
      id: app-token
      with:
        client-id: ${{ vars.APP_CLIENT_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: terraform-linters
        repositories: homebrew-tap
        permission-contents: write
        permission-pull-requests: write
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v7.3.0
      with:
        version: v2.19.0
        args: release --release-notes tools/release/release-note.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
    - uses: actions/attest@v4.2.2
      with:
        subject-path: 'dist/checksums.txt'
