name: generate

on: pull_request

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        submodules: true
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: 'go.mod'
    - run: go generate ./...
    - run: git add --intent-to-add .
    - run: git diff --exit-code
